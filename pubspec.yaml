name: hrms_mobile
description: "Cross-platform HRMS mobile application for Android and iOS connecting to Render SaaS PostgreSQL"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & API
  http: ^1.2.2

  # State Management
  provider: ^6.1.2

  # Local Storage & Session Persistence
  shared_preferences: ^2.3.2

  # Device & Hardware Access
  geolocator: ^13.0.1
  device_info_plus: ^11.1.0

  # UI & Formatting
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
