name: Build HRMS Mobile App (APK & iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. BUILD ANDROID APK
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Recreate Clean Native Android Shell
        run: |
          rm -rf android
          flutter create --platforms=android --org com.ramel --project-name hrms_mobile .
          # Ensure minSdk is 21 for geolocator
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          # Add location and network permissions
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: HRMS-Android-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  # ==========================================
  # 2. BUILD IOS (PAYLOAD PACKAGE)
  # ==========================================
  build-ios:
    name: Build iOS Package
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Recreate Clean Native iOS Shell
        run: |
          rm -rf ios
          flutter create --platforms=ios --org com.ramel --project-name hrms_mobile .

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS App (No-CodeSign)
        run: flutter build ios --release --no-codesign

      - name: Create iOS Payload IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r HRMS-iOS-Release.ipa Payload

      - name: Upload iOS Package
        uses: actions/upload-artifact@v4
        with:
          name: HRMS-iOS-Package
          path: HRMS-iOS-Release.ipa
