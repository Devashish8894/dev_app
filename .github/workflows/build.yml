name: Build HRMS Mobile App (APK & iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. BUILD ANDROID APK
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons || {
            echo "Flutter build failed. Showing Gradle stacktrace:"
            cd android
            ./gradlew assembleRelease --stacktrace
            exit 1
          }

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: HRMS-Android-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  # ==========================================
  # 2. BUILD IOS (PAYLOAD PACKAGE)
  # ==========================================
  build-ios:
    name: Build iOS Package
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Recreate Clean Native iOS Shell
        run: |
          rm -rf ios
          flutter create --platforms=ios --org com.ramel --project-name hrms_mobile .

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS App (No-CodeSign)
        run: flutter build ios --release --no-codesign

      - name: Create iOS Payload IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r HRMS-iOS-Release.ipa Payload

      - name: Upload iOS Package
        uses: actions/upload-artifact@v4
        with:
          name: HRMS-iOS-Package
          path: HRMS-iOS-Release.ipa
