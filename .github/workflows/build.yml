name: Build HRMS Mobile App (APK & iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. BUILD ANDROID APK
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Recreate Clean Native Android Shell
        run: |
          rm -rf android
          flutter create --platforms=android --org com.ramel --project-name hrms_mobile .
          python3 -c "
          import os

          # 1. Ensure permissions in AndroidManifest.xml
          path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(path):
              with open(path, 'r') as f:
                  data = f.read()
              perms = '''
                  <uses-permission android:name=\"android.permission.INTERNET\"/>
                  <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>
                  <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>
                  <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>
              '''
              if '<application' in data and 'android.permission.INTERNET' not in data:
                  data = data.replace('<application', perms + '    <application', 1)
                  with open(path, 'w') as f:
                      f.write(data)

          # 2. Fix compileSdkVersion for geolocator_android in build.gradle & build.gradle.kts
          for fpath in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              if os.path.exists(fpath):
                  with open(fpath, 'r') as f:
                      txt = f.read()
                  txt = txt.replace('flutter.compileSdkVersion', '34')
                  txt = txt.replace('flutter.minSdkVersion', '21')
                  txt = txt.replace('flutter.targetSdkVersion', '34')
                  with open(fpath, 'w') as f:
                      f.write(txt)

          # 3. Add rootProject ext versions for plugin listeners
          for rpath in ['android/build.gradle', 'android/build.gradle.kts']:
              if os.path.exists(rpath):
                  with open(rpath, 'r') as f:
                      rtxt = f.read()
                  if 'ext.compileSdkVersion' not in rtxt:
                      rtxt = 'allprojects {\n    ext.compileSdkVersion = 34\n    ext.minSdkVersion = 21\n    ext.targetSdkVersion = 34\n}\n' + rtxt
                      with open(rpath, 'w') as f:
                          f.write(rtxt)
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: HRMS-Android-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  # ==========================================
  # 2. BUILD IOS (PAYLOAD PACKAGE)
  # ==========================================
  build-ios:
    name: Build iOS Package
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Recreate Clean Native iOS Shell
        run: |
          rm -rf ios
          flutter create --platforms=ios --org com.ramel --project-name hrms_mobile .

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS App (No-CodeSign)
        run: flutter build ios --release --no-codesign

      - name: Create iOS Payload IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r HRMS-iOS-Release.ipa Payload

      - name: Upload iOS Package
        uses: actions/upload-artifact@v4
        with:
          name: HRMS-iOS-Package
          path: HRMS-iOS-Release.ipa
